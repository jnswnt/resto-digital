<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistem Kasir Pintar, Denah Meja Interaktif, dan Manajemen Restoran Modern - Mini Resto POS">
  <meta name="theme-color" content="#EA580C">

  <!-- Google OAuth 2.0 Web Client ID untuk Login Pemilik Resto -->
  <meta name="google-signin-client_id" content="59601017378-8esd6kvtamagkjjnm2q6qac94gblbooq.apps.googleusercontent.com">

  <!-- Script Resmi Google Identity Services (GIS) SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Resto POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mini Resto POS - Kasir & Manajemen Meja</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
      transition: opacity 0.3s ease-out;
    }

    .brand-icon {
      font-size: 56px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(234, 88, 12, 0.4));
      animation: float 2.4s ease-in-out infinite;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #F8FAFC;
      margin: 0;
    }

    .brand-tagline {
      font-size: 14px;
      color: #94A3B8;
      margin: 0;
    }

    .loading-spinner {
      margin-top: 12px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #EA580C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-icon">🍽️</div>
    <h1 class="brand-title">Mini Resto POS</h1>
    <p class="brand-tagline">Memuat Sistem Kasir & Manajemen Meja...</p>
    <div class="loading-spinner"></div>
  </div>

  <!-- Helper Pencetakan Struk Thermal POS & Ekspor Gambar Nota Digital -->
  <script>
    window.printThermalHtml = function(htmlContent) {
      try {
        var iframe = document.getElementById('thermal-print-iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.id = 'thermal-print-iframe';
          iframe.style.position = 'fixed';
          iframe.style.right = '0';
          iframe.style.bottom = '0';
          iframe.style.width = '0';
          iframe.style.height = '0';
          iframe.style.border = '0';
          document.body.appendChild(iframe);
        }
        var win = iframe.contentWindow;
        if (win) {
          win.document.open();
          win.document.write(htmlContent);
          win.document.close();
          setTimeout(function() {
            win.focus();
            win.print();
          }, 300);
        }
      } catch (err) {
        console.error("Gagal mencetak struk thermal:", err);
      }
    };

    // Helper Download File Gambar / Dokumen dari Base64
    window.downloadFileFromBase64 = function(base64Data, fileName, mimeType) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: mimeType || 'image/png'});
        var url = URL.createObjectURL(blob);
        var downloadLink = document.createElement('a');
        downloadLink.href = url;
        downloadLink.download = fileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        setTimeout(function() {
          URL.revokeObjectURL(url);
        }, 1500);
      } catch (err) {
        console.error("Gagal mendownload file gambar nota:", err);
      }
    };

    // Helper Salin Gambar ke Clipboard Sistem
    window.copyImageToClipboard = async function(base64Data) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: 'image/png'});
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        return true;
      } catch (err) {
        console.warn("Clipboard API gambar tidak tersedia di browser ini:", err);
        return false;
      }
    };

    // Deteksi frame pertama rendering Flutter untuk transisi splash screen yang halus & bebas lag
    function dismissAppSplash() {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer && !loadingContainer.classList.contains('dismissed')) {
        loadingContainer.classList.add('dismissed');
        loadingContainer.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
        loadingContainer.style.opacity = '0';
        loadingContainer.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loadingContainer && loadingContainer.parentNode) {
            loadingContainer.parentNode.removeChild(loadingContainer);
          }
        }, 400);
      }
    }

    // Dengarkan event resmi Flutter First Frame
    window.addEventListener('flutter-first-frame', dismissAppSplash);

    // Fallback: Pantau kemunculan elemen flutter-view di DOM
    var observer = new MutationObserver(function(mutations, obs) {
      var fltView = document.querySelector('flutter-view, flt-glass-pane');
      if (fltView) {
        // Beri sedikit jeda render awal lalu hilangkan splash
        setTimeout(dismissAppSplash, 200);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback durasi maksimal (4 detik) agar splash screen tidak pernah memblokir layar jika frame telat
    setTimeout(dismissAppSplash, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
